<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品ページ</title>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 360px;
    }

    .heading {
      font-family: 'BIZ UDMincho', serif;
      font-size: 26px;
      font-weight: 700;
      color: #222;
      margin: 0 0 1.2rem;
      line-height: 1.6;
    }

    .card a {
      display: block;
      text-decoration: none;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
      transition: opacity 0.2s;
    }

    .card img:hover {
      opacity: 0.85;
    }

    .card p {
      margin-top: 1rem;
      color: #666;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <a href="https://www.dmm.co.jp/dc/doujin/-/detail/=/cid=d_675994/" target="_blank" class="heading-link">
      <p class="heading">私の漫画は下記をクリック</p>
    </a>
    <a href="https://www.dmm.co.jp/dc/doujin/-/detail/=/cid=d_675994/" target="_blank">
      <img src="https://doujin-assets.dmm.co.jp/digital/comic/d_675994/d_675994pr.jpg" alt="作品パッケージ">
      <p>クリックして作品ページへ</p>
    </a>
  </div>

</body>
</html>
